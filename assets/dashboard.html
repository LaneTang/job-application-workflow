<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Applications</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #000000;
      --muted: #575852;
      --paper: #F1F0E8;
      --white: #fff;
      --line: #c7c7be;
      --violet: #bc2117;
      --lavender: #deded4;
      --green: #333333;
      --radius: 0px;
      font: 15px/1.55 "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body, h1, h2, h3, p, dl, dd { margin: 0; }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .58; }
    a { color: var(--violet); text-underline-offset: 3px; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid #D62D20; outline-offset: 3px; }
    .wrap { width: min(1280px, calc(100% - 72px)); margin-inline: auto; }
    .topbar { border-bottom: 1px solid var(--line); background: var(--white); }
    .bar { min-height: 65px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand, .bar-actions, .quiet-button, .action, .search, .detail-meta {
      display: flex; align-items: center; gap: 9px;
    }
    .brand { font-size: 14px; font-weight: 700; white-space: nowrap; }
    .brand-mark {
      display: grid; place-items: center; width: 34px; height: 34px;
      color: white; background: var(--violet); border-radius: 10px 10px 10px 4px;
    }
    .icon { width: 17px; height: 17px; flex: none; }
    .bar-actions { gap: 15px; }
    .local { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .local::before {
      display: inline-block; margin-right: 6px; width: 7px; height: 7px;
      border-radius: 50%; background: #D62D20; content: "";
    }
    .quiet-button {
      padding: 7px 11px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--white); font-size: 13px; white-space: nowrap;
    }
    .quiet-button:hover, .action.secondary:hover { background: var(--paper); }
    main { padding: 38px 0 56px; }
    .overview {
      display: grid; grid-template-columns: 1fr minmax(355px, .83fr);
      align-items: center; gap: 32px; margin-bottom: 31px;
    }
    h1 { font-size: clamp(36px, 4vw, 53px); font-weight: 780; line-height: 1.14; letter-spacing: -.055em; }
    .intro { color: var(--muted); margin-top: 11px; font-size: 14px; }
    .pipeline {
      padding: 16px 19px; border: 1px solid #000000; background: #F1F0E8;
      border-radius: 15px 15px 15px 5px;
    }
    .pipeline-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .pipeline-head strong { color: #000000; font-size: 14px; }
    .pipeline-head span { color: var(--muted); font-size: 12px; }
    .track {
      position: relative; display: flex; height: 12px; margin: 11px 0 9px;
      overflow: hidden; border-radius: 3px; background: #deded4;
    }
    .track > span { height: 100%; }
    .track .sent, .legend .sent { background: #000000; }
    .track .open, .legend .open { background: #D62D20; }
    .track .closed, .legend .closed { background: #70716B; }
    .track[data-ticks]::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(to right, transparent 0 calc(var(--step) - 2px), #F1F0E8 calc(var(--step) - 2px) var(--step));
    }
    .legend { display: flex; flex-wrap: wrap; gap: 3px 15px; color: #333333; font-size: 12px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 7px; height: 7px; border-radius: 2px; }
    .notice { margin: -8px 0 15px; padding: 9px 13px; border-radius: 8px; background: #e8f4ec; color: #245c42; }
    .notice.error { background: #fae9e8; color: #9c3736; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1.18fr) minmax(0, 1fr); align-items: start; gap: 19px; }
    .roster, .dossier {
      min-width: 0; border: 1px solid var(--line); background: var(--white);
      border-radius: var(--radius);
    }
    .roster { overflow: hidden; }
    .roster-head { padding: 16px 18px 0; }
    h2 { font-size: 21px; line-height: 1.35; letter-spacing: -.025em; }
    .roster-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .search {
      padding: 0 11px; background: #FFFFFF; border: 1px solid #000000;
      border-radius: 9px; color: #575852;
    }
    .search:focus-within { border-color: #D62D20; box-shadow: 0 0 0 2px #deded4; }
    .search input { display: block; min-width: 0; width: 100%; height: 39px; border: 0; outline: 0; background: transparent; font-size: 13px; }
    .search input::placeholder { color: #575852; }
    .filters { display: flex; flex-wrap: wrap; gap: 2px 14px; margin: 7px 0 -1px; }
    .filter {
      position: relative; padding: 9px 1px 10px; border: 0; border-bottom: 2px solid transparent;
      background: none; color: var(--muted); font-size: 13px; white-space: nowrap;
    }
    .filter:hover, .filter[aria-pressed="true"] { color: var(--violet); }
    .filter[aria-pressed="true"] { border-color: var(--violet); font-weight: 700; }
    .filter span { margin-left: 4px; font-variant-numeric: tabular-nums; font-size: 11px; }
    .jobs { min-height: 100px; list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
    .jobs li + li { border-top: 1px solid var(--line); }
    .job {
      display: grid; width: 100%; grid-template-columns: minmax(0, 1fr) auto 10px;
      gap: 10px; position: relative; align-items: center; text-align: left;
      padding: 13px 16px 13px 18px; border: 0; background: transparent;
    }
    .job:focus-visible { outline-offset: -4px; }
    .job:hover { background: #eeeee6; }
    .job[aria-current="true"] { background: #eeeee6; }
    .job[aria-current="true"]::before {
      position: absolute; inset: 7px auto 7px 0; width: 3px; background: #D62D20; border-radius: 0 3px 3px 0; content: "";
    }
    .role { display: block; font-size: 14px; line-height: 1.37; font-weight: 700; overflow-wrap: anywhere; }
    .company { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .row-state { text-align: right; }
    .row-state small { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; white-space: nowrap; }
    .chevron { width: 6px; height: 6px; border: solid #000000; border-width: 1px 1px 0 0; transform: rotate(45deg); }
    .badge {
      display: inline-flex; gap: 5px; align-items: center; max-width: 100%;
      padding: 3px 8px; border-radius: 5px; color: #000000; background: #e5e5dd;
      font-size: 11px; line-height: 1.4; font-weight: 650; white-space: nowrap;
    }
    .badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .badge[data-state="submitted"], .badge[data-state="interviewing"], .badge[data-state="offer"] { color: #000000; background: #e5e5dd; }
    .badge[data-state="ready_for_review"], .badge[data-state="filling"], .badge[data-state="checking"] { color: #bc2117; background: #e5e5dd; }
    .badge[data-state="waiting_for_user"], .badge[data-state="needs_review"] { color: #000000; background: #e5e5dd; }
    .badge[data-state="blocked"], .badge[data-state="rejected"] { color: #bc2117; background: #ffe9e6; }
    .badge[data-state="invited"], .badge[data-state="assessment"] { color: #bc2117; background: #e5e5dd; }
    .badge.ghost { color: #8a3d31; background: #f9eee7; }
    .row-state > .badge + .badge { display: table; margin: 4px 0 0 auto; }
    .dossier { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; scrollbar-width: thin; }
    .dossier-head { padding: 20px 20px 17px; }
    .detail-company { color: var(--violet); font-size: 13px; font-weight: 700; margin-bottom: 5px; }
    .detail-company a { text-decoration: none; }
    .detail-company a:hover { text-decoration: underline; }
    .dossier h2 { font-size: clamp(20px, 2.1vw, 27px); overflow-wrap: anywhere; }
    .detail-meta { flex-wrap: wrap; margin-top: 9px; color: var(--muted); font-size: 12px; }
    .detail-meta .badge { margin-right: 2px; }
    .detail-meta span { overflow-wrap: anywhere; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 14px; }
    .action {
      width: fit-content; min-height: 35px; padding: 6px 10px; border: 1px solid transparent;
      border-radius: 7px; background: var(--violet); color: white; text-decoration: none;
      font-size: 12px; font-weight: 650;
    }
    .action:hover { background: #000000; }
    .action.secondary { color: var(--violet); background: white; border-color: #000000; }
    .action .icon { width: 14px; height: 14px; }
    .detail-block { padding: 14px 20px; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
    .detail-block h3 { font-size: 14px; margin-bottom: 7px; font-weight: 750; }
    .detail-block p, .detail-block li, .facts { font-size: 13px; }
    .detail-block p + p { margin-top: 5px; }
    .tracking { margin: 0 13px 10px; padding: 12px 14px; border: 0; border-radius: 10px; background: #e5e5dd; }
    .tracking p { color: #000000; }
    .tracking .actions { margin-top: 9px; }
    .facts { display: grid; grid-template-columns: minmax(80px, .44fr) minmax(0, 1fr); gap: 6px 10px; }
    .facts dt, .muted { color: var(--muted); }
    .disclosure { padding: 10px 20px; border-top: 1px solid var(--line); }
    .disclosure summary { cursor: pointer; color: var(--violet); font-size: 13px; font-weight: 650; }
    .disclosure > :not(summary) { margin-top: 9px; font-size: 13px; overflow-wrap: anywhere; }
    .disclosure ul, .detail-block ul { padding-left: 17px; margin-bottom: 0; }
    .history { list-style: none; padding-left: 0 !important; }
    .history li { padding-left: 11px; border-left: 2px solid var(--lavender); padding-bottom: 7px; }
    .history time { display: block; color: var(--muted); font-size: 11px; }
    .progress-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .progress-header h3 { margin-bottom: 0; }
    .waiting { color: var(--muted); margin-bottom: 10px; }
    .waiting.overdue { color: #8a3d31; }
    dialog {
      width: min(440px, calc(100% - 28px)); max-height: calc(100dvh - 28px); overflow: auto;
      border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; color: var(--ink);
    }
    dialog::backdrop { background: rgb(33 25 50 / 38%); }
    .progress-form label { display: block; font-size: 13px; margin-top: 11px; font-weight: 650; }
    .progress-form input, .progress-form select {
      width: 100%; margin-top: 4px; padding: 6px 9px; border: 1px solid #70716B;
      border-radius: 7px; background: #FFFFFF;
    }
    .progress-form .error-text { font-size: 13px; margin-top: 9px; }
    .question + .question { margin-top: 12px; }
    .question label { display: block; font-weight: 680; overflow-wrap: anywhere; }
    textarea {
      display: block; width: 100%; min-height: 85px; margin-top: 6px;
      padding: 8px 10px; border: 1px solid #70716B; border-radius: 7px; resize: vertical; background: #FFFFFF;
    }
    .answer-status, .question p { font-size: 12px; }
    .question-section { background: #F1F0E8; }
    .answer-status { color: var(--muted); }
    .error-text { color: #a03239; }
    .empty { padding: 25px 18px; color: var(--muted); font-size: 13px; }
    .empty strong { display: block; color: var(--ink); margin-bottom: 4px; }
    .back { display: none; }
    .followup { color: var(--green); }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
    }
    @media (max-width: 850px) {
      .wrap { width: calc(100% - 36px); }
      .overview { gap: 20px; grid-template-columns: 1fr minmax(280px, .93fr); }
      .workspace { gap: 12px; }
    }
    @media (max-width: 680px) {
      .wrap { width: calc(100% - 28px); }
      .bar { min-height: 57px; }
      .bar-actions { gap: 8px; }
      .local { display: none; }
      main { padding-top: 24px; }
      .overview { grid-template-columns: 1fr; gap: 16px; margin-bottom: 18px; }
      .workspace { display: block; }
      .dossier { display: none; position: static; max-height: none; }
      .workspace.mobile-open .roster { display: none; }
      .workspace.mobile-open .dossier { display: block; }
      .back { display: flex; margin: 15px 15px 0; }
      .dossier h2 { font-size: 23px; }
    }

    /* Constructivist composition: one diagonal, disciplined working surfaces. */
    :root { --accent: #D62D20; }
    .wrap { width: min(1440px, calc(100% - 64px)); }
    .topbar { border-bottom: 3px solid black; background: var(--paper); }
    .bar { min-height: 72px; }
    .brand { font-size: 17px; letter-spacing: -.035em; }
    .brand-mark { border-radius: 0; background: black; width: 32px; height: 32px; }
    .local { color: black; }
    .local::before { border-radius: 0; width: 9px; height: 9px; }
    .quiet-button, .action, .search, textarea, .progress-form input, .progress-form select,
    dialog, .tracking, .badge, .notice, .track, .legend i { border-radius: 0; }
    .quiet-button { border: 1px solid black; background: transparent; padding: 9px 13px; }
    .quiet-button:hover { background: black; color: white; }
    main { padding-top: 0; }
    .overview { position: relative; isolation: isolate; overflow: hidden; min-height: 254px;
      grid-template-columns: 1.3fr 1fr; align-items: end; gap: 64px; padding: 48px 0 30px;
      margin-bottom: 32px; border-bottom: 6px solid black; }
    .overview::before { content: ''; position: absolute; z-index: -1; width: 270px; height: 400px;
      background: var(--accent); left: 44%; top: -220px; transform: rotate(32deg); pointer-events: none; }
    h1 { font-family: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif; font-stretch: condensed;
      font-size: clamp(55px, 7.5vw, 108px); line-height: .91; letter-spacing: -.075em; font-weight: 900; }
    .intro { max-width: 48ch; color: black; font-size: 15px; line-height: 1.5; margin-top: 24px; }
    .pipeline { background: var(--paper); border: 0; border-radius: 0; padding: 18px 0 0; }
    .pipeline-head { align-items: center; }
    .pipeline-head strong { font-size: 16px; }
    .pipeline-head span { font-size: 15px; color: black; font-weight: 700; }
    .track { height: 28px; margin: 15px 0 12px; }
    .legend { font-size: 12px; gap: 8px 18px; }
    .workspace { gap: 26px; }
    .roster, .dossier { border: 0; background: white; }
    .roster-head { padding: 23px 24px 0; border-top: 3px solid black; }
    h2 { font-weight: 800; letter-spacing: -.04em; }
    .roster-title h2 { font-size: 27px; }
    .count { color: black; font-size: 13px; }
    .search { border: 1px solid black; padding: 2px 12px; }
    .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .search input { height: 43px; font-size: 14px; }
    .filters { gap: 0; margin: 16px -24px 0; border-top: 1px solid black; }
    .filter { flex: 0 1 auto; padding: 11px 13px; border-bottom: 1px solid var(--line);
      font-size: 12px; color: black; min-height: 44px; }
    .filter:hover { background: var(--paper); color: black; }
    .filter[aria-pressed="true"] { background: black; color: white; border-color: black; }
    .filter span { font-size: 11px; margin-left: 7px; }
    .jobs { border-top: 2px solid black; }
    .job { padding: 21px 24px; gap: 20px; min-height: 92px; }
    .job[aria-current="true"] { background: var(--paper); }
    .job[aria-current="true"]::before { inset: 0 auto 0 0; border-radius: 0; background: var(--accent); width: 6px; }
    .role { font-size: 16px; line-height: 1.3; letter-spacing: -.025em; }
    .company { font-size: 13px; margin-top: 7px; color: #575852; }
    .badge { font-size: 11px; padding: 4px 7px; font-weight: 700; }
    .badge::before { border-radius: 0; width: 4px; height: 4px; }
    .badge[data-state="ready_for_review"] { background: black; color: white; }
    .badge[data-state="offer"], .badge[data-state="invited"] { background: var(--accent); color: white; }
    .row-state small { white-space: normal; max-width: 190px; line-height: 1.4; }
    .dossier { border-top: 6px solid var(--accent); }
    .dossier-head { padding: 26px; }
    .dossier h2 { font-size: clamp(25px, 2.6vw, 38px); line-height: 1.1; }
    .detail-company { color: #bc2117; margin-bottom: 12px; }
    .detail-meta { margin-top: 15px; }
    .actions { gap: 8px; }
    .action { background: black; border: 1px solid black; padding: 10px 13px; font-size: 13px; }
    .action:hover { background: #bc2117; border-color: #bc2117; }
    .action.secondary { color: black; }
    .action.secondary:hover { background: var(--paper); }
    .detail-block { padding: 21px 26px; }
    .detail-block h3 { font-size: 16px; }
    .detail-block p, .detail-block li, .facts { line-height: 1.6; }
    .tracking { margin: 0 26px 18px; padding: 18px; border-left: 4px solid black; }
    .disclosure { padding: 16px 26px; }
    .disclosure summary { color: black; }
    textarea { padding: 12px; min-height: 110px; }
    .question + .question { margin-top: 24px; }
    .history li { border-color: black; }
    dialog { border: 3px solid black; padding: 26px; box-shadow: 10px 10px 0 #D62D20; }
    dialog::backdrop { background: rgb(0 0 0 / 48%); }
    :focus-visible { outline: 3px solid #bc2117; outline-offset: 3px; }
    @media (max-width: 1000px) {
      .wrap { width: calc(100% - 40px); }
      .overview { gap: 32px; grid-template-columns: 1.1fr 1fr; }
      .overview::before { left: 40%; width: 170px; }
      .job { padding: 18px; gap: 10px; }
    }
    @media (max-width: 680px) {
      .wrap { width: calc(100% - 28px); }
      .bar { min-height: 65px; }
      .brand { font-size: 15px; }
      .overview { grid-template-columns: 1fr; gap: 26px; padding: 38px 0 23px; min-height: 0; }
      .overview::before { left: auto; right: -75px; top: -280px; width: 190px; }
      h1 { font-size: clamp(48px, 12vw, 77px); }
      .intro { font-size: 14px; max-width: 33ch; margin-top: 20px; }
      .pipeline { padding: 0; }
      .roster-head { padding: 18px 16px 0; }
      .filters { margin-inline: -16px; }
      .filter { padding: 10px; }
      .job { grid-template-columns: minmax(0,1fr) auto 6px; }
      .role { font-size: 14px; }
      .dossier-head, .detail-block, .disclosure { padding: 20px; }
      .tracking { margin-inline: 20px; }
      .back { margin: 16px 20px 0; }
    }

    /* Modern constructivism: graphic masthead, quiet working area. */
    .topbar { background: #000; color: #fff; border: 0; }
    .brand-mark { background: #D62D20; }
    .local { color: #fff; }
    .bar .quiet-button { border-color: #666; color: #fff; }
    .bar .quiet-button:hover { background: #fff; color: #000; }
    .overview { background: #D62D20; color: white; margin-inline: -32px; padding: 64px 32px 32px;
      min-height: 330px; border: 0; grid-template-columns: 1.35fr 1fr; align-items: end; gap: 60px; }
    .overview::before { width: 340px; height: 340px; left: auto; right: -130px; top: -170px;
      background: black; transform: rotate(35deg); }
    .overview::after { content: ''; position: absolute; width: 90px; height: 90px; border: 18px solid black;
      border-radius: 50%; left: 55%; top: 40px; z-index: -1; pointer-events: none; }
    h1 { font-size: clamp(64px, 8.7vw, 130px); letter-spacing: -.08em; }
    .intro { color: white; font-size: 16px; max-width: 38ch; margin-top: 24px; }
    .pipeline { background: transparent; color: white; }
    .pipeline-head strong, .pipeline-head span { color: white; }
    .track { height: 40px; background: #fff; }
    .track .open, .legend .open { background: #fff; }
    .track .closed, .legend .closed { background: #f4aaa2; }
    .track[data-ticks]::after { background: repeating-linear-gradient(to right, transparent 0 calc(var(--step) - 2px), #D62D20 calc(var(--step) - 2px) var(--step)); }
    .legend { color: white; font-size: 12px; }
    .overview + .notice { margin-top: 16px; }
    .roster-head { border-top: 0; padding: 26px 24px 0; }
    .roster { background: transparent; }
    .roster-title h2 { font-size: 33px; }
    .search { background: white; border: 0; border-bottom: 2px solid black; min-height: 54px; }
    .filters { margin-top: 20px; margin-bottom: 20px; gap: 5px; border: 0; padding-inline: 24px; }
    .filter { border: 1px solid #c5c5bb; background: transparent; padding: 9px 12px; }
    .filter[aria-pressed="true"] { background: black; border-color: black; }
    .filter:hover { background: #e1e1d7; }
    .filter[aria-pressed="true"]:hover { background: black; }
    .jobs { border: 0; }
    .jobs li + li { border-color: #cccfc3; }
    .job { background: #fff; margin-bottom: 5px; min-height: 105px; }
    .job:hover { background: #e5e5dc; }
    .job[aria-current="true"] { background: #000; color: #fff; }
    .job[aria-current="true"] .company, .job[aria-current="true"] .row-state small { color: #ddd; }
    .job[aria-current="true"] .chevron { border-color: white; }
    .role { font-size: 17px; font-weight: 750; }
    .company { margin-top: 10px; }
    .badge { padding: 5px 8px; }
    .dossier { border: 0; margin-top: 26px; box-shadow: 8px 8px 0 #d8d8ce; }
    .dossier-head { border-top: 10px solid black; }
    .tracking { background: #f1f0e8; border-left: 5px solid #D62D20; }
    .action { background: #D62D20; border-color: #D62D20; color: #fff; }
    .action:hover { background: black; border-color: black; }
    .action.secondary { background: white; border-color: black; }
    .detail-block { border-color: #deded4; }
    .workspace { padding-top: 10px; }
    @media (max-width: 1000px) {
      .overview { margin-inline: -20px; padding-inline: 20px; gap: 28px; }
      .overview::after { left: 54%; width: 66px; height: 66px; border-width: 14px; }
    }
    @media (max-width: 680px) {
      .overview { margin-inline: -14px; padding: 44px 14px 25px; min-height: 0; grid-template-columns: 1fr; gap: 28px; }
      .overview::before { width: 175px; height: 175px; right: -105px; top: -95px; }
      .overview::after { width: 48px; height: 48px; border-width: 10px; left: auto; right: 20px; top: 120px; }
      h1 { font-size: clamp(51px, 13vw, 84px); }
      .intro { font-size: 14px; max-width: 31ch; }
      .track { height: 28px; }
      .roster-head { padding-inline: 0; }
      .filters { margin-inline: 0; padding: 0; gap: 5px; }
      .filter { padding: 8px 10px; }
      .job { padding: 18px 14px; gap: 10px; }
      .role { font-size: 15px; }
      .dossier { margin-top: 20px; box-shadow: none; }
    }

    .overview { --hero-bg:#f4ce68; background:var(--hero-bg); color:#252821;
      margin:0 -32px 28px; padding:64px 48px 138px; min-height:440px;
      grid-template-columns:minmax(0,1fr) 240px; align-items:center; gap:48px;
      overflow:hidden; border:0; }
    .overview > div {position:relative;z-index:1;}
    .overview::before,.overview::after {display:none;}
    .hero-word {position:absolute;z-index:0;right:28px;bottom:-.17em;
      font-family:'Helvetica Neue',Arial,sans-serif;font-size:clamp(80px,11.5vw,176px);
      font-weight:850;line-height:1;letter-spacing:-.065em;
      color:transparent;background:linear-gradient(175deg,rgba(255,252,234,.25),rgba(255,252,234,.035) 88%);
      background-clip:text;-webkit-background-clip:text;pointer-events:none;user-select:none;white-space:nowrap;}
    .overview h1 {font-family:'Helvetica Neue',Arial,sans-serif;font-size:clamp(44px,6.4vw,92px);
      font-stretch:normal;font-weight:650;line-height:1.08;letter-spacing:-.045em;}
    .overview #refresh {margin-top:28px;border:1px solid #34372d;background:transparent;color:inherit;
      padding:11px 16px;font-size:12px;font-weight:600;box-shadow:none;}
    .overview #refresh:hover {background:#252821;color:#fff8df;}
    .overview #refresh:focus-visible {outline:2px solid #252821;outline-offset:4px;}
    .pipeline {color:#252821;text-align:center;padding:0;background:transparent;}
    .pipeline-head {justify-content:center;}
    .pipeline-head strong {color:#4b4b37;font-size:12px;font-weight:500;}
    .chart-wrap {position:relative;width:180px;height:180px;margin:16px auto 0;}
    #status-pie {display:block;width:100%;height:100%;overflow:visible;}
    #status-pie > path,#status-pie > circle {stroke:var(--hero-bg);stroke-width:3;cursor:help;transition:opacity .15s;}
    #status-pie > path:hover,#status-pie > circle:hover {opacity:.76;}
    #status-pie > :focus-visible {outline:none;stroke:#252821;stroke-width:3;}
    .chart-center {position:absolute;inset:28%;background:var(--hero-bg);border-radius:50%;display:flex;
      flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
    .chart-center strong {font-size:32px;line-height:1.1;letter-spacing:-.05em;}
    .chart-center span {font-size:10px;color:#4b4b37;margin-top:4px;}
    .chart-hint {min-height:20px;font-size:11px;color:#4b4b37;margin-top:12px;}
    @media (max-width:1000px) {
      .overview {margin-inline:-20px;padding:48px 28px 116px;gap:24px;grid-template-columns:minmax(0,1fr) 200px;min-height:380px;}
    }
    @media (max-width:680px) {
      .overview {margin-inline:-14px;padding:44px 22px 100px;min-height:330px;grid-template-columns:minmax(0,1fr) 150px;gap:16px;}
      .overview h1 {font-size:clamp(28px,6.8vw,45px);}
      .hero-word {font-size:11.5vw;right:14px;bottom:-.14em;}
      .chart-wrap {width:140px;height:140px;margin-top:12px;}
      .chart-center strong {font-size:27px;}
      .pipeline-head strong,.chart-hint {font-size:10px;}
      .overview #refresh {font-size:11px;padding:9px 12px;margin-top:22px;}
    }
    @media (max-width:420px) {
      .overview {grid-template-columns:1fr;gap:28px;padding:36px 22px 85px;}
      .overview h1 {font-size:40px;}
      .pipeline {display:grid;grid-template-columns:140px 1fr;align-items:center;text-align:left;column-gap:14px;}
      .chart-wrap {grid-column:1;grid-row:1 / 3;margin:0;}
      .pipeline-head {grid-column:2;align-self:end;justify-content:flex-start;}
      .chart-hint {grid-column:2;align-self:start;margin-top:8px;}
    }
    @media(prefers-reduced-motion:reduce) {#status-pie > path,#status-pie > circle {transition:none;}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="overview" aria-labelledby="page-title">
      <span class="hero-word" aria-hidden="true">APPLICATIONS</span>
      <div>
        <h1 id="page-title">Applications</h1>
        <button class="quiet-button" id="refresh" type="button">Refresh records</button>
      </div>
      <div class="pipeline">
        <div class="pipeline-head"><strong>Application overview</strong></div>
        <div class="chart-wrap"><svg id="status-pie" viewBox="0 0 240 240" aria-label="Application status distribution"></svg>
        <div class="chart-center"><strong id="total">0</strong><span>positions</span></div></div>
        <p id="chart-hint" class="chart-hint" aria-live="polite">Hover to explore</p>
      </div>
    </section>
    <p id="notice" class="notice" role="status" hidden></p>
    <div class="workspace" id="workspace">
      <section class="roster" aria-labelledby="roster-title">
        <div class="roster-head">
          <div class="roster-title"><h2 id="roster-title">Jobs</h2><span id="result-count" class="count" aria-live="polite"></span></div>
          <label class="search">
            <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/></svg>
            <span class="sr-only">Search company, role or ID</span>
            <input id="search" type="search" placeholder="Search company, role or ID" autocomplete="off">
          </label>
          <div class="filters" role="group" aria-label="Filter applications">
            <button class="filter" type="button" data-filter="all" aria-pressed="true">All<span></span></button>
            <button class="filter" type="button" data-filter="pending" aria-pressed="false">need refill<span></span></button>
            <button class="filter" type="button" data-filter="ready" aria-pressed="false">ready to go<span></span></button>
            <button class="filter" type="button" data-filter="submitted" aria-pressed="false">submitted<span></span></button>
            <button class="filter" type="button" data-filter="rejected" aria-pressed="false">rejected<span></span></button>
            <button class="filter" type="button" data-filter="ghost" aria-pressed="false">ghost<span></span></button>
            <button class="filter" type="button" data-filter="invited" aria-pressed="false">interview invited<span></span></button>
            <button class="filter" type="button" data-filter="done" aria-pressed="false">done interview<span></span></button>
            <button class="filter" type="button" data-filter="round" aria-pressed="false">more round<span></span></button>
            <button class="filter" type="button" data-filter="offered" aria-pressed="false">offered<span></span></button>
          </div>
        </div>
        <ul id="jobs" class="jobs"><li class="empty">Loading applications…</li></ul>
      </section>
      <section class="dossier" aria-label="Application details">
        <button id="back" class="quiet-button back" type="button">‹ Back to jobs</button>
        <div id="detail" class="empty">Select a job to view its application.</div>
      </section>
    </div>
  </main>
  <dialog id="progress-dialog" aria-labelledby="progress-title">
    <form class="progress-form" id="progress-form">
      <h2 id="progress-title">Record recruiting progress</h2>
      <p id="progress-job" class="muted"></p>
      <label>Event<select id="progress-kind" name="kind" required></select></label>
      <label>Event date<input id="progress-date" name="date" type="date" required></label>
      <label id="round-field" hidden>Interview round (optional)<input name="round" type="number" min="1" step="1" placeholder="e.g. 2"></label>
      <label id="schedule-field" hidden>Scheduled interview date<input name="scheduled_for" type="date"></label>
      <label>Notes (optional)<textarea name="note" maxlength="2000" rows="2"></textarea></label>
      <p id="progress-error" class="error-text" role="alert" hidden></p>
      <div class="actions">
        <button class="action" type="submit">Save progress</button>
        <button class="quiet-button" id="progress-cancel" type="button">Cancel</button>
      </div>
    </form>
  </dialog>
  <script>
    const labels = {
      queued: 'Queued', checking: 'Checking', filling: 'Filling', waiting_for_user: 'Needs information',
      ready_for_review: 'Ready for review', submitted: 'Submitted', closed: 'Closed', needs_review: 'Needs review',
      blocked: 'Blocked', interviewing: 'Interviewing', offer: 'Offered', rejected: 'Rejected', withdrawn: 'Withdrawn',
    };
    const progressLabels = {interview_invited:'Interview invited', interview_scheduled:'Interview scheduled', interview_completed:'Interview completed', assessment_invited:'Assessment invited', assessment_completed:'Assessment completed', employer_reply:'Employer reply', action_requested:'Action requested', candidate_replied:'Candidate replied', offer:'Offer received', accepted:'Offer accepted', declined:'Offer declined', rejected:'Rejected', withdrawn:'Withdrawn'};
    function progressLabel(event) { return `${event.round ? `Round ${event.round} · ` : ''}${progressLabels[event.kind] || event.kind}`; }
    const eventLabels = {record_created: 'Record created', record_updated: 'Record updated', answers_saved: 'Save answers', recruiting_event_recorded: 'Recruiting progress recorded'};
    const questionLabels = {awaiting_answer: 'Awaiting answer', answered: 'Answered, awaiting fill', applied: 'Filled and verified', skipped: 'Skipped'};
    const identifierLabels = {job_id: 'Job ID', requisition_id: 'Requisition ID', publication_id: 'Posting ID', linkedin_id: 'LinkedIn ID'};
    const recruitingStates = new Set(['invited', 'interviewing', 'assessment']);
    const submittedStates = new Set(['submitted', 'offer', 'rejected', 'withdrawn', 'accepted', 'declined', ...recruitingStates]);
    const $ = id => document.getElementById(id);
    const drafts = new Map();
    const mobile = matchMedia('(max-width: 680px)');
    const filters = [...document.querySelectorAll('[data-filter]')];
    let state = {jobs: []};
    let filter = 'all';
    let selectedId;
    let showingMobileDetail = false;
    let detailSignature;
    let loading = false;
    let saving = false;
    let initialized = false;
    let progressJobId;

    function element(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function link(text, url, className) {
      try {
        const target = new URL(url);
        if (!['http:', 'https:'].includes(target.protocol)) return null;
        const node = element('a', text, className);
        node.href = target.href;
        node.target = '_blank';
        node.rel = 'noopener noreferrer';
        return node;
      } catch {
        return null;
      }
    }

    function formatTime(value, withTime = false) {
      if (!value) return '';
      if (/^\d{4}-\d{2}-\d{2}$/.test(value)) return value;
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      const options = {year: 'numeric', month: '2-digit', day: '2-digit', timeZone: state.timezone || 'UTC'};
      if (withTime) Object.assign(options, {hour: '2-digit', minute: '2-digit', hourCycle: 'h23'});
      return new Intl.DateTimeFormat('en-US', options).format(date);
    }

    function notice(text = '', error = false) {
      $('notice').textContent = text;
      $('notice').hidden = !text;
      $('notice').classList.toggle('error', error);
    }

    function hasDrafts() {
      return [...drafts.values()].some(answers => answers.size);
    }

    function syncRefresh() {
      $('refresh').disabled = loading || saving || hasDrafts();
      $('refresh').title = hasDrafts() ? 'Save your edited answers first' : '';
    }

    function status(job) {
      const category = applicationCategory(job);
      const names = {pending: 'need refill', ready: 'ready to go', submitted: 'submitted', rejected: 'rejected', ghost: 'ghost', invited: 'interview invited', done: 'done interview', round: 'more round', offered: 'offered'};
      const badge = element('span', names[category], 'badge');
      badge.dataset.state = job.state;
      return [badge];
    }

    function reviewHint(job) {
      if (['round', 'done', 'invited'].includes(applicationCategory(job))) return ((job.recruiting?.events?.[0]) ? progressLabel(job.recruiting.events[0]) : labels[job.state] || job.state);
      if (job.state === 'assessment') return 'Assessment';
      if (job.state === 'closed' || job.state === 'withdrawn') return labels[job.state];
      if (job.status_confidence === 'imported_unverified') return 'Submission unverified';
      if (job.status_confidence === 'company_confirmed_role_unverified') return 'Role unverified';
      if (!submittedStates.has(job.state) && job.pending_question_count > 0) return `${job.pending_question_count} answer(s) awaiting fill`;
      return '';
    }

    function applicationCategory(job) {
      if (job.state === 'rejected') return 'rejected';
      if (['offer', 'accepted', 'declined'].includes(job.state)) return 'offered';
      if (job.recruiting?.ghost) return 'ghost';
      const interviews = (job.recruiting_events || []).filter(event => event.kind.startsWith('interview_'))
        .slice().sort((a, b) => a.date.localeCompare(b.date) || (a.recorded_at || '').localeCompare(b.recorded_at || ''));
      const last = interviews[interviews.length - 1];
      if (['invited', 'interviewing'].includes(job.state)) {
        if (last?.round > 1) return 'round';
        if (last?.kind === 'interview_completed') return 'done';
        return 'invited';
      }
      if (submittedStates.has(job.state)) return 'submitted';
      if (job.ready_to_go) return 'ready';
      return 'pending';
    }

    function matches(job, value) {
      return value === 'all' || applicationCategory(job) === value;
    }

    function sortTime(job) {
      return Date.parse(job.recruiting?.latest_event || job.confirmation_received_at || job.submitted_at || job.checked_at || job.updated_at) || 0;
    }

    function renderOverview() {
      const groups = [
        ['pending','need refill','#858b94'], ['ready','ready to go','#61789e'],
        ['submitted','submitted','#638cc2'], ['rejected','rejected','#b88f91'],
        ['ghost','ghost','#b9b8bd'], ['invited','interview invited','#43a6ac'],
        ['done','done interview','#47b98c'], ['round','more round','#9bcb62'],
        ['offered','offered','#f3c94e']
      ];
      const total = state.jobs.length;
      $('total').textContent = total;
      const svg = $('status-pie'); svg.replaceChildren();
      const hint = $('chart-hint');
      hint.textContent = total ? 'Hover to explore' : 'No positions yet';
      const ns = 'http://www.w3.org/2000/svg';
      let angle = -Math.PI / 2;
      for (const [key,label,color] of groups) {
        const count = state.jobs.filter(job => applicationCategory(job) === key).length;
        if (!count) continue;
        const end = angle + count / total * Math.PI * 2;
        const path = document.createElementNS(ns, count === total ? 'circle' : 'path');
        if (count === total) {path.setAttribute('cx',120);path.setAttribute('cy',120);path.setAttribute('r',112);}
        else path.setAttribute('d', `M120 120 L${120+112*Math.cos(angle)} ${120+112*Math.sin(angle)} A112 112 0 ${end-angle>Math.PI?1:0} 1 ${120+112*Math.cos(end)} ${120+112*Math.sin(end)} Z`);
        path.setAttribute('fill',color);path.setAttribute('tabindex','0');
        const text = `${label}: ${count} (${(count / total * 100).toFixed(1)}%)`;
        path.setAttribute('aria-label',text);path.setAttribute('role','img');
        const title = document.createElementNS(ns,'title');title.textContent=text;path.append(title);
        for (const event of ['mouseenter','focus','touchstart']) path.addEventListener(event,()=>{hint.textContent=text;});
        for (const event of ['mouseleave','blur']) path.addEventListener(event,()=>{hint.textContent='Hover to explore';});
        svg.append(path);angle=end;
      }
    }

    function selectJob(id, openOnMobile = false) {
      selectedId = id;
      if (openOnMobile) showingMobileDetail = true;
      $('workspace').classList.toggle('mobile-open', showingMobileDetail);
      for (const button of $('jobs').querySelectorAll('button')) {
        if (button.dataset.job === id) button.setAttribute('aria-current', 'true');
        else button.removeAttribute('aria-current');
      }
      renderDetail(state.jobs.find(job => job.id === id));
      if (openOnMobile && mobile.matches) {
        $('back').focus({preventScroll: true});
        $('workspace').scrollIntoView({block: 'start'});
      }
    }

    function renderList() {
      for (const button of filters) {
        button.setAttribute('aria-pressed', String(button.dataset.filter === filter));
        button.lastElementChild.textContent = state.jobs.filter(job => matches(job, button.dataset.filter)).length;
      }
      const query = $('search').value.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
      const visible = state.jobs.filter(job => {
        const haystack = [job.company, job.role, job.location, job.id, job.recruiting?.label, ...Object.values(job.identifiers || {})].join(' ').toLocaleLowerCase();
        return matches(job, filter) && query.every(word => haystack.includes(word));
      }).sort((a, b) => sortTime(b) - sortTime(a));
      $('result-count').textContent = `Showing ${visible.length}`;
      const previousFocus = document.activeElement?.dataset.job;
      const rows = document.createDocumentFragment();
      for (const job of visible) {
        const item = element('li');
        const row = element('button', undefined, 'job');
        row.type = 'button';
        row.dataset.job = job.id;
        const leading = element('span');
        leading.append(element('strong', job.role || 'Role unverified', 'role'), element('span', job.company || 'Company unverified', 'company'));
        const trailing = element('span', undefined, 'row-state');
        trailing.append(...status(job));
        const hint = reviewHint(job);
        if (hint) trailing.append(element('small', hint));
        const arrow = element('span', undefined, 'chevron');
        arrow.setAttribute('aria-hidden', 'true');
        row.append(leading, trailing, arrow);
        row.addEventListener('click', () => selectJob(job.id, true));
        item.append(row);
        rows.append(item);
      }
      if (!visible.length) {
        const empty = element('li', undefined, 'empty');
        const title = query.length ? 'No matching jobs' : ({
          all: 'No applications yet', pending: 'No applications need refilling', ready: 'No applications ready for review', submitted: 'No submitted applications',
          rejected: 'No rejections', invited: 'No interview invitations', done: 'No completed interviews', round: 'No additional rounds', offered: 'No offers', ghost: 'No applications waiting over 21 days',
        })[filter];
        empty.append(element('strong', title));
        if (query.length) empty.append(document.createTextNode('Try a company name, role keyword or requisition ID.'));
        else if (filter !== 'all') empty.append(document.createTextNode('Switch to All to see other jobs.'));
        rows.append(empty);
      }
      $('jobs').replaceChildren(rows);
      if (!visible.some(job => job.id === selectedId)) {
        selectedId = visible[0]?.id;
        showingMobileDetail = false;
      }
      selectJob(selectedId);
      if (previousFocus && !showingMobileDetail) {
        [...$('jobs').querySelectorAll('button')].find(button => button.dataset.job === previousFocus)?.focus({preventScroll: true});
      }
    }

    function block(title, variant = '') {
      const section = element('section', undefined, `detail-block ${variant}`.trim());
      section.append(element('h3', title));
      return section;
    }

    function entries(parent, pairs) {
      const list = element('dl', undefined, 'facts');
      for (const [key, value] of pairs) {
        const text = Array.isArray(value) ? value.join('、') : value;
        if (text == null || text === '') continue;
        list.append(element('dt', key), element('dd', text));
      }
      if (list.childElementCount) parent.append(list);
    }

    function disclosure(title) {
      const details = element('details', undefined, 'disclosure');
      details.append(element('summary', title));
      return details;
    }

    function listItems(parent, values) {
      if (!values?.length) return;
      const list = element('ul');
      for (const item of values) list.append(element('li', typeof item === 'string' ? item : JSON.stringify(item)));
      parent.append(list);
    }

    function appendActions(parent, items) {
      const actions = element('div', undefined, 'actions');
      for (const [label, url, primary] of items) {
        const entry = link(label, url, primary ? 'action' : 'action secondary');
        if (entry) actions.append(entry);
      }
      if (actions.childElementCount) parent.append(actions);
    }

    function renderDetail(job) {
      const signature = JSON.stringify(job);
      if (signature === detailSignature) return;
      detailSignature = signature;
      const detail = $('detail');
      detail.replaceChildren();
      detail.className = job ? '' : 'empty';
      detail.closest('.dossier').scrollTop = 0;
      if (!job) {
        detail.textContent = 'Select a job to view its application.';
        return;
      }
      const heading = element('header', undefined, 'dossier-head');
      const company = element('p', undefined, 'detail-company');
      company.append(link(job.company, job.company_url) || document.createTextNode(job.company || 'Company unverified'));
      heading.append(company, element('h2', job.role || 'Role unverified'));
      const meta = element('div', undefined, 'detail-meta');
      meta.append(...status(job));
      if (job.location) meta.append(element('span', job.location));
      const ids = Object.entries(job.identifiers || {}).filter(([key, value]) => identifierLabels[key] && value);
      if (ids.length) {
        const [key, value] = ids.find(([key]) => key === 'requisition_id') || ids[0];
        meta.append(element('span', `${identifierLabels[key]} ${value}`));
      }
      heading.append(meta);
      appendActions(heading, [
        [job.ready_to_go ? 'Review application' : 'Open application', job.apply_url, Boolean(job.ready_to_go)],
        ['View job description', job.jd_url !== job.apply_url ? job.jd_url : null],
      ]);
      if (job.ready_to_go) heading.append(element('p', 'Review and submit on the original application website.', 'intro followup'));
      detail.append(heading);

      const tracking = block('Track application', 'tracking');
      const progress = job.tracking || {};
      if (progress.instructions) tracking.append(element('p', progress.instructions));
      else if (!progress.url && !progress.email_url) tracking.append(element('p', 'Tracking information not yet available.'));
      appendActions(tracking, [
        [progress.url === progress.email_url ? 'Open confirmation email' : 'Open tracking portal', progress.url, true],
        ['Open confirmation email', progress.email_url !== progress.url ? progress.email_url : null, !progress.url],
      ]);
      detail.append(tracking);
      if (job.recruiting) detail.append(renderRecruiting(job));

      if (job.questions?.length) detail.append(renderQuestions(job));

      const record = block('Application status');
      entries(record, [
        ['Submission date', formatTime(job.submitted_at)],
        ['Last checked', formatTime(job.checked_at)],
        ['Status source', job.status_source?.label],
        ['Posting status', job.posting_status],
      ]);
      if (record.childElementCount === 1) record.append(element('p', 'No verification record yet.', 'muted'));
      detail.append(record);
      if (job.status_audit) {
        const audit = disclosure('Latest status check');
        audit.append(element('p', formatTime(job.status_audit.checked_at, true), 'muted'));
        listItems(audit, job.status_audit.findings);
        detail.append(audit);
      }

      if (Object.values(job.job_details || {}).some(value => value != null && value !== '')) {
        const facts = block('Job snapshot');
        entries(facts, Object.entries(job.job_details));
        detail.append(facts);
      }
      if (!job.apply_url && !job.jd_url) record.append(element('p', 'Original job link not yet available.', 'muted'));
      if (job.blockers?.length || job.notes?.length) {
        const notes = disclosure('Notes and items to confirm');
        listItems(notes, job.blockers);
        listItems(notes, job.notes);
        detail.append(notes);
      }
      if (job.resume_path || job.fields?.length || ids.length) {
        const sources = disclosure('Materials and field sources');
        entries(sources, [
          ...ids.map(([key, value]) => [identifierLabels[key], value]),
          ['Resume', job.resume_path],
          ...(job.fields || []).map(field => [field.label, [field.value, field.verified ? 'Verified' : 'Unverified', field.source].filter(value => value != null && value !== '').join(' / ')]),
        ]);
        detail.append(sources);
      }
      if (job.history?.length || job.submission_evidence?.text) {
        const history = disclosure('Change history');
        if (job.submission_evidence?.text) history.append(element('p', job.submission_evidence.text));
        const timeline = element('ul', undefined, 'history');
        for (const event of [...(job.history || [])].reverse()) {
          const item = element('li');
          item.append(element('time', formatTime(event.at, true)));
          const transition = event.from_state && event.from_state !== event.to_state
            ? `${labels[event.from_state] || event.from_state} → ${labels[event.to_state] || event.to_state}`
            : labels[event.to_state] || '';
          item.append(document.createTextNode([eventLabels[event.event] || event.event, transition].filter(Boolean).join(' / ')));
          timeline.append(item);
        }
        if (timeline.childElementCount) history.append(timeline);
        detail.append(history);
      }
    }

    function renderRecruiting(job) {
      const progress = job.recruiting;
      const section = element('section', undefined, 'detail-block');
      const header = element('div', undefined, 'progress-header');
      const add = element('button', 'Add progress', 'quiet-button');
      add.type = 'button';
      add.addEventListener('click', () => openProgress(job));
      header.append(element('h3', 'Recruiting timeline'), add);
      section.append(header);
      let waiting = '';
      if (progress.waiting_on === 'candidate') waiting = 'Waiting for your response or next action';
      else if (progress.waiting_on === 'scheduled') waiting = 'Interview scheduled';
      else if (progress.waiting_days != null) {
        waiting = progress.ghost
          ? `Ghost: waiting ${progress.waiting_days} days for a response`
          : `Waiting ${progress.waiting_days} days for a response`;
      } else if (progress.waiting_on) waiting = 'Waiting start date unknown';
      if (waiting) section.append(element('p', waiting, progress.ghost ? 'waiting overdue' : 'waiting'));

      const timeline = element('ul', undefined, 'history');
      for (const event of progress.events) {
        const item = element('li');
        item.append(element('time', formatTime(event.date)), element('strong', progressLabel(event)));
        if (event.scheduled_for) item.append(element('p', `Interview date ${formatTime(event.scheduled_for)}`, 'muted'));
        if (event.note) item.append(element('p', event.note));
        if (event.source) item.append(element('p', event.source, 'muted'));
        timeline.append(item);
      }
      const submission = element('li');
      submission.append(element('time', formatTime(progress.submitted_on) || 'Date unknown'), element('strong', 'Application submitted'));
      timeline.append(submission);
      section.append(timeline);
      return section;
    }

    function syncProgressFields() {
      const kind = $('progress-kind').value;
      const round = $('round-field').querySelector('input');
      const schedule = $('schedule-field').querySelector('input');
      round.disabled = $('round-field').hidden = !kind.startsWith('interview_');
      schedule.disabled = $('schedule-field').hidden = kind !== 'interview_scheduled';
      schedule.required = !schedule.disabled;
      schedule.min = $('progress-date').value;
    }

    function openProgress(job) {
      if (saving) return;
      progressJobId = job.id;
      $('progress-form').reset();
      $('progress-job').textContent = [job.company, job.role].filter(Boolean).join(' / ');
      const placeholder = element('option', 'Select an event');
      placeholder.value = '';
      placeholder.disabled = true;
      const options = Object.entries(state.recruiting_event_types).map(([value, label]) => {
        const option = element('option', progressLabels[value] || label);
        option.value = value;
        return option;
      });
      $('progress-kind').replaceChildren(placeholder, ...options);
      $('progress-kind').value = '';
      $('progress-date').max = state.today;
      $('progress-date').min = job.recruiting.submitted_on || '';
      $('progress-date').value = state.today;
      $('progress-error').hidden = true;
      syncProgressFields();
      $('progress-dialog').showModal();
    }

    async function saveProgress(event) {
      event.preventDefault();
      if (saving) return;
      const form = $('progress-form');
      const payload = Object.fromEntries(new FormData(form));
      payload.job_id = progressJobId;
      if (payload.round) payload.round = Number(payload.round);
      else delete payload.round;
      const buttons = [...form.querySelectorAll('button')];
      const error = $('progress-error');
      error.hidden = true;
      saving = true;
      buttons.forEach(button => { button.disabled = true; });
      syncRefresh();
      try {
        const response = await fetch('/api/recruiting-events', {
          method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Please try again.');
        state = data;
        $('progress-dialog').close();
        renderList();
        notice('Recruiting progress saved.');
      } catch (failure) {
        error.textContent = `Save failed.${failure.message}`;
        error.hidden = false;
      } finally {
        saving = false;
        buttons.forEach(button => { button.disabled = false; });
        syncRefresh();
      }
    }

    function renderQuestions(job) {
      const canEdit = !submittedStates.has(job.state);
      const section = block('Application questions', 'question-section');
      const save = element('button', 'Save answers', 'action');
      save.type = 'button';
      const message = element('span', undefined, 'answer-status');
      message.setAttribute('role', 'status');
      const inputs = [];
      function syncSave() {
        save.disabled = saving || !drafts.get(job.id)?.size;
      }
      for (const [index, question] of job.questions.entries()) {
        const box = element('div', undefined, 'question');
        const inputId = `answer-${index}`;
        const label = element('label', question.text);
        label.htmlFor = inputId;
        box.append(label, element('p', `${question.required !== false ? 'Required' : 'Optional'} / ${questionLabels[question.status] || 'Awaiting answer'}`, 'muted'));
        if (question.options?.length) box.append(element('p', `Options: ${question.options.join(' / ')}`, 'muted'));
        if (question.limit) box.append(element('p', `Original length limit: ${question.limit}`, 'muted'));
        const source = link('View question source', question.source_url);
        if (source) box.append(source);
        const input = element('textarea');
        input.id = inputId;
        input.value = drafts.get(job.id)?.get(question.id)?.answer ?? question.answer ?? '';
        input.readOnly = !canEdit;
        inputs.push(input);
        input.addEventListener('input', () => {
          if (!drafts.has(job.id)) drafts.set(job.id, new Map());
          const edits = drafts.get(job.id);
          const original = edits.get(question.id)?.expected_answer ?? question.answer ?? '';
          if (input.value === original) edits.delete(question.id);
          else edits.set(question.id, {answer: input.value, expected_answer: original});
          message.classList.remove('error-text');
          message.textContent = edits.size ? 'Unsaved changes' : '';
          syncSave();
          syncRefresh();
        });
        box.append(input);
        section.append(box);
      }
      if (canEdit) {
        const actions = element('div', undefined, 'actions');
        actions.append(save, message);
        section.append(actions);
        if (drafts.get(job.id)?.size) message.textContent = 'Unsaved changes';
        syncSave();
        save.addEventListener('click', async () => {
          if (saving || !drafts.get(job.id)?.size) return;
          saving = true;
          syncSave();
          syncRefresh();
          inputs.forEach(input => { input.readOnly = true; });
          message.classList.remove('error-text');
          message.textContent = 'Saving…';
          const answers = [...drafts.get(job.id)].map(([id, value]) => ({id, ...value}));
          try {
            const response = await fetch('/api/answers', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({job_id: job.id, answers}),
            });
            const data = await response.json();
            if (!response.ok) throw new Error(response.status === 409
              ? 'The job or answer changed elsewhere. Your edits remain on this page.' : 'Please try again.');
            drafts.delete(job.id);
            state = data;
            detailSignature = undefined;
            renderOverview();
            renderList();
            notice('Answers saved. Return to the chat and ask to continue filling.');
          } catch (error) {
            notice(`Save failed.${error.message}`, true);
            message.textContent = 'Save failed. Your edits remain on this page.';
            message.classList.add('error-text');
          } finally {
            saving = false;
            inputs.forEach(input => { input.readOnly = false; });
            syncSave();
            syncRefresh();
            $('detail').querySelector('.question-section button')?.dispatchEvent(new Event('answer-state-changed'));
          }
        });
        save.addEventListener('answer-state-changed', syncSave);
      }
      return section;
    }

    async function refresh(manual = false) {
      if (loading || saving || hasDrafts()) return;
      loading = true;
      syncRefresh();
      try {
        const response = await fetch('/api/state');
        if (!response.ok) throw new Error();
        const data = await response.json();
        if (saving || hasDrafts()) return;
        if (!initialized || JSON.stringify(data) !== JSON.stringify(state)) {
          initialized = true;
          state = data;
          renderOverview();
          renderList();
        }
        if (manual || $('notice').classList.contains('error')) notice();
      } catch {
        notice('Unable to load applications. Check the local server, then click Refresh records.', true);
        if (!initialized) $('jobs').replaceChildren(element('li', 'Applications are temporarily unavailable.', 'empty'));
      } finally {
        loading = false;
        syncRefresh();
      }
    }

    $('refresh').addEventListener('click', () => refresh(true));
    $('progress-form').addEventListener('submit', saveProgress);
    $('progress-kind').addEventListener('change', syncProgressFields);
    $('progress-date').addEventListener('change', syncProgressFields);
    $('progress-cancel').addEventListener('click', () => $('progress-dialog').close());
    $('progress-dialog').addEventListener('cancel', event => { if (saving) event.preventDefault(); });
    $('search').addEventListener('input', renderList);
    for (const button of filters) {
      button.addEventListener('click', () => {
        filter = button.dataset.filter;
        showingMobileDetail = false;
        renderList();
      });
    }
    $('back').addEventListener('click', () => {
      showingMobileDetail = false;
      $('workspace').classList.remove('mobile-open');
      [...$('jobs').querySelectorAll('button')].find(button => button.dataset.job === selectedId)?.focus();
    });
    refresh();
    setInterval(() => {
      if (!$('progress-dialog').open && !document.querySelector('#detail details[open]') && !$('detail').contains(document.activeElement)) refresh();
    }, 5000);
  </script>
</body>
</html>
